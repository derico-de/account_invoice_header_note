# Odoo idioms that collide with ruff defaults.
line-length = 120

[lint.per-file-ignores]
# The manifest is a bare dict literal, by design.
"__manifest__.py" = ["B018"]
# Odoo discovers submodules through these imports; they are never referenced.
"__init__.py" = ["F401"]
"**/__init__.py" = ["F401"]
# _inherit, _sql_constraints etc. are Odoo class attributes, not mutable defaults.
"models/*.py" = ["RUF012"]

[format]
# Odoo core and the sibling buev_zert module use single quotes; don't churn them.
quote-style = "preserve"
